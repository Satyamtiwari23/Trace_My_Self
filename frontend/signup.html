<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digital Footprint Detector — discover publicly visible information about your digital identity."
    />
    <title>Create Account | Digital Footprint Detector</title>
    <style>
      /* Signup page CSS */

      /* -----------------------------------------
   Page Layout
   ----------------------------------------- */

      .auth-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 30px 15px;

        background:
          radial-gradient(
            circle at 85% 35%,
            rgba(45, 75, 105, 0.1),
            transparent 30%
          ),
          radial-gradient(
            circle at 15% 65%,
            rgba(35, 55, 75, 0.08),
            transparent 30%
          ),
          #151515;

        color: #edf5ff;
      }

      /* -----------------------------------------
   Signup Card
   ----------------------------------------- */

      .auth-card {
        width: min(470px, 100%);
        padding: 32px;

        background: #242424;
        border: 1px solid #333333;
        border-radius: 18px;

        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      }

      /* -----------------------------------------
   Header
   ----------------------------------------- */

      .auth-header {
        text-align: center;
        margin-bottom: 28px;
      }

      .auth-header .logo {
        justify-content: center;
        margin-bottom: 22px;

        color: #f5f5f5;
      }

      .auth-header .logo-mark {
        background: linear-gradient(135deg, #4f8cff, #7b61ff);
      }

      .auth-title {
        color: #f5f5f5;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .auth-header p {
        color: #999999;
      }

      /* -----------------------------------------
   Form
   ----------------------------------------- */

      .form-group {
        margin-top: 18px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;

        color: #f5f5f5;
        font-weight: 500;
      }

      /* -----------------------------------------
   Input
   ----------------------------------------- */

      .input {
        width: 100%;
        padding: 13px 15px;

        color: #f5f5f5;
        background: #1c1c1c;

        border: 1px solid #333333;
        border-radius: 10px;

        outline: none;
        transition: 0.2s ease;
      }

      .input::placeholder {
        color: #777777;
      }

      .input:focus {
        border-color: #4f8cff;
        box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.12);
      }

      /* -----------------------------------------
   Password Input
   ----------------------------------------- */

      .input-wrap {
        position: relative;
      }

      .input-wrap .input {
        padding-right: 65px;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 12px;

        transform: translateY(-50%);

        padding: 4px 6px;

        color: #9db0c7;
        background: transparent;

        border: 0;
      }

      .password-toggle:hover {
        color: #ffffff;
      }

      /* -----------------------------------------
   Password Strength
   ----------------------------------------- */

      .strength {
        margin-top: 8px;
      }

      .strength-bars {
        display: flex;
        gap: 4px;
      }

      .strength-bars span {
        height: 4px;
        flex: 1;

        border-radius: 4px;
        background: #26384d;
      }

      .strength-text {
        margin-top: 4px;

        color: #999999;
        font-size: 0.75rem;
      }

      /* -----------------------------------------
   Terms Checkbox
   ----------------------------------------- */

      .checkbox {
        display: flex;
        gap: 9px;
        align-items: flex-start;

        margin-top: 20px;

        color: #999999;
        font-size: 0.85rem;
      }

      .checkbox input {
        margin-top: 4px;
        accent-color: #4f8cff;
      }

      .checkbox .helper-link {
        color: #76a7ff;
      }

      .checkbox .helper-link:hover {
        color: #9dc0ff;
      }

      /* -----------------------------------------
   Error Message
   ----------------------------------------- */

      .error {
        display: none;
        margin: 12px 0;

        color: #ff6b6b;
        font-size: 0.9rem;
      }

      /* -----------------------------------------
   Create Account Button
   ----------------------------------------- */

      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 17px;

        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        font-weight: 700;
        cursor: pointer;

        transition: 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: #4f8cff;
        color: #ffffff;

        box-shadow: 0 10px 25px rgba(79, 140, 255, 0.2);
      }

      .btn-block {
        width: 100%;
        margin-top: 20px;
      }

      /* -----------------------------------------
   Footer
   ----------------------------------------- */

      .auth-footer {
        margin-top: 22px;

        text-align: center;

        color: #999999;
        font-size: 0.9rem;
      }

      .helper-link {
        color: #76a7ff;
      }

      .helper-link:hover {
        color: #9dc0ff;
      }

      /* -----------------------------------------
   Responsive
   ----------------------------------------- */

      @media (max-width: 620px) {
        .auth-page {
          padding: 20px 15px;
        }

        .auth-card {
          padding: 24px;
        }

        .auth-title {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>

  <body class="auth-page">
    <!-- Page content starts here -->

    <div class="auth-card">
      <div class="auth-header">
        <a class="logo" href="index.html"
          ><span class="logo-mark">◈</span> FootprintGuard</a
        >
        <h1 class="auth-title">Create Account</h1>
        <p>Start monitoring your public digital footprint.</p>
      </div>
      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="name">Name</label
          ><input class="input" id="name" placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label
          ><input
            class="input"
            id="email"
            type="email"
            placeholder="you@example.com"
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              class="input"
              id="password"
              type="password"
              placeholder="Create a strong password"
            /><button
              type="button"
              class="password-toggle"
              data-target="password"
            >
              Show
            </button>
          </div>
          <div class="strength">
            <div class="strength-bars">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="strength-text" id="strengthText">Very weak</div>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <input
              class="input"
              id="confirmPassword"
              type="password"
              placeholder="Repeat your password"
            /><button
              type="button"
              class="password-toggle"
              data-target="confirmPassword"
            >
              Show
            </button>
          </div>
        </div>
        <label class="checkbox"
          ><input id="terms" type="checkbox" />
          <span
            >I agree to the <a class="helper-link" href="#">Terms</a> &amp;
            <a class="helper-link" href="#">Privacy Policy</a>.</span
          ></label
        >
        <div class="error" id="signupError" class="signup-error"></div>
        <button class="btn btn-primary btn-block" type="submit">
          Create Account
        </button>
      </form>
      <div class="auth-footer">
        Already have an account?
        <a class="helper-link" href="login.html">Login</a>
      </div>
    </div>
    <!-- Signup page JS -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("signupForm");
        const error = document.getElementById("signupError");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput =
            document.getElementById("confirmPassword");
        const strengthText = document.getElementById("strengthText");
        const strengthBars =
            document.querySelectorAll(".strength-bars span");
        const termsCheckbox = document.getElementById("terms");

        function updatePasswordStrength(password) {
            let score = 0;

            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            strengthBars.forEach((bar, index) => {
                bar.style.background =
                    index < score ? "var(--success)" : "#26384d";
            });

            const strengthLabels = [
                "Very weak",
                "Weak",
                "Good",
                "Strong",
                "Very strong"
            ];

            strengthText.textContent =
                strengthLabels[score] || "Very weak";
        }

        passwordInput.addEventListener("input", () => {
            updatePasswordStrength(passwordInput.value);
        });

        document.querySelectorAll(".password-toggle").forEach((button) => {
            button.addEventListener("click", () => {
                const targetId = button.dataset.target;
                const input = document.getElementById(targetId);

                if (input.type === "password") {
                    input.type = "text";
                    button.textContent = "Hide";
                } else {
                    input.type = "password";
                    button.textContent = "Show";
                }
            });
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            error.style.display = "none";
            error.textContent = "";

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (name.length < 2) {
                error.textContent = "Please enter your name.";
                error.style.display = "block";
                return;
            }

            if (!email.includes("@")) {
                error.textContent = "Please enter a valid email.";
                error.style.display = "block";
                return;
            }

            if (password.length < 8) {
                error.textContent =
                    "Password must be at least 8 characters.";
                error.style.display = "block";
                return;
            }

            if (password !== confirmPassword) {
                error.textContent = "Passwords do not match.";
                error.style.display = "block";
                return;
            }

            if (!termsCheckbox.checked) {
                error.textContent =
                    "Please accept the Terms and Privacy Policy.";
                error.style.display = "block";
                return;
            }

            try {
                const response = await fetch(
                    "http://localhost:5000/api/auth/signup",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name,
                            email,
                            password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    error.textContent =
                        data.message || "Unable to create account.";
                    error.style.display = "block";
                    return;
                }

                alert("Account created successfully.");

                window.location.href = "login.html";
            } catch (requestError) {
                console.error("Signup request failed:", requestError);

                error.textContent =
                    "Unable to connect to the server. Please try again.";
                error.style.display = "block";
            }
        });
    });
    </script>
  </body>
</html>
